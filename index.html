<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Usuarios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #333; }
    h2 { margin-bottom: 10px; color: #444; }

    .contenedor { max-width: 900px; margin: auto; }

    /* LOGIN */
    #pantalla-login {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    #pantalla-login h2 { text-align: center; margin-bottom: 20px; }

    /* CRUD */
    #pantalla-crud { display: none; }

    .formulario {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .formulario input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .formulario button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .formulario button:hover { background: #45a049; }

    .tabla-contenedor {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f0f0f0; font-weight: bold; }
    tr:hover { background: #fafafa; }

    .btn-editar {
      background: #2196F3;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }

    .btn-eliminar {
      background: #f44336;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-logout {
      background: #888;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }

    .btn-editar:hover   { background: #1976D2; }
    .btn-eliminar:hover { background: #d32f2f; }
    .btn-logout:hover   { background: #666; }

    .mensaje {
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      display: none;
    }

    .mensaje.exito { background: #dff0d8; color: #3c763d; display: block; }
    .mensaje.error { background: #f2dede; color: #a94442; display: block; }

    .usuario-info {
      text-align: right;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<!-- PANTALLA LOGIN -->
<div id="pantalla-login">
  <h2>Iniciar Sesión</h2>
  <div id="mensaje-login" class="mensaje"></div>
  <input type="email"    id="login-email"    placeholder="Email">
  <input type="password" id="login-password" placeholder="Contraseña">
  <button onclick="login()" style="margin-top:10px; width:100%; padding:10px;
    background:#4CAF50; color:white; border:none; border-radius:6px;
    font-size:15px; cursor:pointer;">
    Entrar
  </button>
</div>

<!-- PANTALLA CRUD -->
<div id="pantalla-crud" class="contenedor">

  <div class="usuario-info">
    <span id="usuario-email"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>

  <h1>CRUD de Usuarios</h1>

  <div id="mensaje" class="mensaje"></div>

  <div class="formulario">
    <h2 id="titulo-form">Agregar Usuario</h2>
    <input type="hidden" id="usuario-id">
    <input type="text"   id="nombre" placeholder="Nombre completo">
    <input type="email"  id="email"  placeholder="Email">
    <input type="number" id="edad"   placeholder="Edad">
    <button onclick="guardarUsuario()">Guardar</button>
    <button onclick="cancelarEdicion()" id="btn-cancelar"
      style="background:#888; margin-top:8px; display:none">
      Cancelar
    </button>
  </div>

  <div class="tabla-contenedor">
    <h2>Lista de Usuarios</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Edad</th>
          <th>Creado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios">
        <tr><td colspan="6" style="text-align:center">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api/users';
  const AUTH = 'http://localhost:3000/api/auth';
  let token = null;

  // Headers con token
  function headers() {
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    };
  }

  // Mostrar mensaje
  function mostrarMensaje(texto, tipo, loginForm = false) {
    const id = loginForm ? 'mensaje-login' : 'mensaje';
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = `mensaje ${tipo}`;
    setTimeout(() => el.className = 'mensaje', 3000);
  }

  // LOGIN
  async function login() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email || !password) {
      mostrarMensaje('Email y contraseña son obligatorios', 'error', true);
      return;
    }

    try {
      const res = await fetch(`${AUTH}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        mostrarMensaje(data.error, 'error', true);
        return;
      }

      // Guardar token y mostrar CRUD
      token = data.token;
      document.getElementById('pantalla-login').style.display = 'none';
      document.getElementById('pantalla-crud').style.display  = 'block';
      document.getElementById('usuario-email').textContent    = email;
      cargarUsuarios();
    } catch (err) {
      mostrarMensaje('Error al conectar con el servidor', 'error', true);
    }
  }

  // LOGOUT
  function logout() {
    token = null;
    document.getElementById('pantalla-login').style.display = 'block';
    document.getElementById('pantalla-crud').style.display  = 'none';
    document.getElementById('login-email').value            = '';
    document.getElementById('login-password').value         = '';
  }

  // Cargar todos los usuarios
  async function cargarUsuarios() {
    try {
      const res = await fetch(API, { headers: headers() });

      if (res.status === 401) { logout(); return; }

      const usuarios = await res.json();
      const tbody    = document.getElementById('tabla-usuarios');

      if (usuarios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">No hay usuarios registrados</td></tr>';
        return;
      }

      tbody.innerHTML = usuarios.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.nombre}</td>
          <td>${u.email}</td>
          <td>${u.edad ?? '-'}</td>
          <td>${new Date(u.creado_en).toLocaleDateString('es-PE')}</td>
          <td>
            <button class="btn-editar"   onclick="editarUsuario(${u.id}, '${u.nombre}', '${u.email}', ${u.edad})">Editar</button>
            <button class="btn-eliminar" onclick="eliminarUsuario(${u.id})">Eliminar</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      mostrarMensaje('Error al cargar usuarios', 'error');
    }
  }

  // Guardar — crea o edita
  async function guardarUsuario() {
    const id     = document.getElementById('usuario-id').value;
    const nombre = document.getElementById('nombre').value.trim();
    const email  = document.getElementById('email').value.trim();
    const edad   = document.getElementById('edad').value;

    if (!nombre || !email) {
      mostrarMensaje('Nombre y email son obligatorios', 'error');
      return;
    }

    const body   = { nombre, email, edad: edad ? parseInt(edad) : null };
    const url    = id ? `${API}/${id}` : API;
    const method = id ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method,
        headers: headers(),
        body: JSON.stringify(body)
      });

      if (res.status === 401) { logout(); return; }

      if (!res.ok) {
        const err = await res.json();
        mostrarMensaje(err.error, 'error');
        return;
      }

      mostrarMensaje(id ? 'Usuario actualizado' : 'Usuario creado', 'exito');
      limpiarFormulario();
      cargarUsuarios();
    } catch (err) {
      mostrarMensaje('Error al guardar', 'error');
    }
  }

  // Editar
  function editarUsuario(id, nombre, email, edad) {
    document.getElementById('usuario-id').value = id;
    document.getElementById('nombre').value     = nombre;
    document.getElementById('email').value      = email;
    document.getElementById('edad').value       = edad;
    document.getElementById('titulo-form').textContent      = 'Editar Usuario';
    document.getElementById('btn-cancelar').style.display   = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Eliminar
  async function eliminarUsuario(id) {
    if (!confirm('¿Estás seguro de eliminar este usuario?')) return;

    try {
      const res = await fetch(`${API}/${id}`, {
        method: 'DELETE',
        headers: headers()
      });

      if (res.status === 401) { logout(); return; }

      if (res.status === 204) {
        mostrarMensaje('Usuario eliminado', 'exito');
        cargarUsuarios();
      }
    } catch (err) {
      mostrarMensaje('Error al eliminar', 'error');
    }
  }

  // Limpiar formulario
  function limpiarFormulario() {
    document.getElementById('usuario-id').value = '';
    document.getElementById('nombre').value     = '';
    document.getElementById('email').value      = '';
    document.getElementById('edad').value       = '';
    document.getElementById('titulo-form').textContent    = 'Agregar Usuario';
    document.getElementById('btn-cancelar').style.display = 'none';
  }

  function cancelarEdicion() { limpiarFormulario(); }
</script>

</body>
</html>
